<div class="absolute inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Editar {{ filename }}</h2>

    <textarea [ngModel]="content" (ngModelChange)="contentChange.emit($event)" rows="18" [disabled]="isSaving"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none font-mono text-sm"
      placeholder="Contenido del archivo"></textarea>

    <div class="flex justify-end space-x-3 mt-5">
      <button (click)="close.emit()" [disabled]="isSaving"
        class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        Cancelar
      </button>
      <button (click)="save.emit()" [disabled]="isSaving"
        class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors">
        {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  </div>
</div>
