<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md border border-gray-100">

    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">
        Iniciar Sesión
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Accede a tu gestor de archivos en la nube
      </p>
    </div>

    @if (errorMessage()) {
    <div class="p-3 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200" role="alert">
      {{ errorMessage() }}
    </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="usuario@ejemplo.com"
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          [ngClass]="{'border-red-500': isFieldInvalid('email'), 'border-gray-300': !isFieldInvalid('email')}" />
        @if (isFieldInvalid('email')) {
        <p class="mt-1 text-xs text-red-500">Ingrese un correo electrónico válido.</p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••"
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          [ngClass]="{'border-red-500': isFieldInvalid('password'), 'border-gray-300': !isFieldInvalid('password')}" />
        @if (isFieldInvalid('password')) {
        <p class="mt-1 text-xs text-red-500">La contraseña es requerida.</p>
        }
      </div>

      <button type="submit" [disabled]="isLoading() || loginForm.invalid"
        class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
        @if (isLoading()) {
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        Autenticando...
        } @else {
        Iniciar Sesión
        }
      </button>

      <div class="text-center text-sm text-gray-600">
        ¿No tienes una cuenta?
        <a routerLink="/auth/register" class="font-medium text-indigo-600 hover:text-indigo-500 ml-1">
          Regístrate aquí
        </a>
      </div>

    </form>
  </div>
</div>
