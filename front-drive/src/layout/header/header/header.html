<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10">

  <div class="flex items-center w-full max-w-xl">
    @if (!authService.isAdmin()) {
    <div class="relative w-full">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input type="text" placeholder="Buscar en la nube (archivos, carpetas)..."
        class="w-full pl-10 pr-4 py-2 bg-gray-100 border border-transparent rounded-lg text-sm focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none transition-all" />
    </div>
    }
  </div>

  <div class="flex items-center space-x-4">
    @if (authService.currentUser(); as user) {
    <div class="flex items-center space-x-3">
      <img [src]="user.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + user.email" [alt]="user.name"
        class="w-9 h-9 rounded-full bg-indigo-50 border border-gray-200" />
      <div class="hidden md:block text-left">
        <p class="text-sm font-semibold text-gray-700 leading-none">{{ user.name }}</p>
        <p class="text-xs text-gray-500 mt-1">{{ user.role }}</p>
      </div>
    </div>

    <button (click)="authService.logout()" title="Cerrar Sesión"
      class="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
    }
  </div>
</header>
