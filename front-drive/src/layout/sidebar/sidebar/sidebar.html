<aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between h-screen sticky top-0">
  <div class="p-4">
    <!-- Logo de la App -->
    <div class="flex items-center space-x-3 px-2 py-3 mb-4">
      <div class="p-2 bg-indigo-600 text-white rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 15a4 4 0 004 4h9a5 5 0 001-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
        </svg>
      </div>
      <span class="text-xl font-bold text-gray-800">CloudDrive</span>
    </div>

    <!-- Navegación Principal -->
    <nav class="space-y-1">
      <a routerLink="/drive/my-drive" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        class="flex items-center space-x-3 px-4 py-2.5 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        <span>Mi Unidad</span>
      </a>

      <a routerLink="/drive/shared" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        class="flex items-center space-x-3 px-4 py-2.5 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span>Compartido conmigo</span>
      </a>

      <a routerLink="/drive/trash" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        class="flex items-center space-x-3 px-4 py-2.5 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>Papelera</span>
      </a>

      <!-- Sección Métricas / Dashboard -->
      <div class="pt-4 mt-4 border-t border-gray-200">
        <span class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Reportes</span>

        <a routerLink="/dashboard/user" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
          class="flex items-center space-x-3 px-4 py-2.5 mt-1 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <span>Mi Almacenamiento</span>
        </a>

        @if (isAdmin()) {
        <a routerLink="/dashboard/admin" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
          class="flex items-center space-x-3 px-4 py-2.5 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Panel Global Admin</span>
        </a>
        }
      </div>
    </nav>
  </div>
</aside>
